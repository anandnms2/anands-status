name: upgrade
# Sundays 05:30 UTC (08:30 EAT): if upstream Beszel has a newer STABLE release, build the branded image
# from it and publish it. The pin is committed to main only AFTER the build succeeds, so if upstream
# changed shape (a branding patch no longer matches) nothing is published and :latest stays on the last good image.
on:
  schedule:
    - cron: "30 5 * * 0"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned version with latest stable upstream release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CUR=$(grep -m1 '^ARG BESZEL_REF=' Dockerfile | cut -d= -f2)
          # releases/latest = newest published, non-draft, non-prerelease release
          NEW=$(gh api repos/henrygd/beszel/releases/latest --jq .tag_name)
          echo "pinned=$CUR latest-stable=$NEW"
          echo "$NEW" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::unexpected release tag '$NEW'"; exit 1; }
          TOP=$(printf '%s\n%s\n' "$CUR" "$NEW" | sort -V | tail -1)
          if [ "$CUR" != "$NEW" ] && [ "$TOP" = "$NEW" ]; then UP=true; else UP=false; fi
          { echo "cur=$CUR"; echo "new=$NEW"; echo "upgrade=$UP"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.upgrade == 'true'
      - uses: docker/login-action@v3
        if: steps.v.outputs.upgrade == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish branded image
        if: steps.v.outputs.upgrade == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            BESZEL_REF=${{ steps.v.outputs.new }}
          tags: |
            ghcr.io/anandnms2/anands-status:latest
            ghcr.io/anandnms2/anands-status:${{ steps.v.outputs.new }}
      - name: Commit the new pin
        if: steps.v.outputs.upgrade == 'true'
        run: |
          set -euo pipefail
          sed -i "s/^ARG BESZEL_REF=.*/ARG BESZEL_REF=${{ steps.v.outputs.new }}/" Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Upgrade Beszel ${{ steps.v.outputs.cur }} -> ${{ steps.v.outputs.new }}"
          git push origin HEAD:main
