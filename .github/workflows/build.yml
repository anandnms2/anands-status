name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # weekly rebuild to pick up base-image patches
  workflow_dispatch:
    inputs:
      beszel_ref:
        description: "Upstream Beszel tag to build (e.g. v0.21.0)"
        required: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve Beszel version (workflow input, else the pin in Dockerfile)
        id: ref
        run: |
          REF="${{ inputs.beszel_ref }}"
          [ -n "$REF" ] || REF=$(grep -m1 '^ARG BESZEL_REF=' Dockerfile | cut -d= -f2)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            BESZEL_REF=${{ steps.ref.outputs.ref }}
          tags: |
            ghcr.io/anandnms2/anands-status:latest
            ghcr.io/anandnms2/anands-status:${{ steps.ref.outputs.ref }}
